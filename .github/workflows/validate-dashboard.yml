name: Dashboard validation
on:
  push:
    branches: [master]
    paths: ['dashboard/**', 'tests/**', '.github/workflows/validate-dashboard.yml']
  pull_request:
    paths: ['dashboard/**', 'tests/**', '.github/workflows/validate-dashboard.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run dashboard consistency checks
        run: node --test tests/dashboard.test.mjs
